<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0d0d0d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c9a96e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c9a96e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="600" rx="20" fill="url(#bg)"/>
  <rect width="500" height="600" rx="20" fill="url(#centerGlow)"/>
  <rect width="500" height="600" rx="20" fill="none" stroke="#c9a96e" stroke-width="1" stroke-opacity="0.3"/>
  
  <!-- Inner frame -->
  <rect x="20" y="20" width="460" height="560" rx="15" fill="none" stroke="#c9a96e" stroke-width="0.4" stroke-opacity="0.2" stroke-dasharray="3 5"/>
  
  <!-- Abstract female silhouette - luxury style -->
  <g transform="translate(250, 280)">
    <!-- Body glow -->
    <ellipse cx="0" cy="50" rx="80" ry="130" fill="#c9a96e" fill-opacity="0.06"/>
    
    <!-- Hair waves -->
    <path d="M-60,-180 Q-80,-120 -70,-60" stroke="#c9a96e" stroke-width="2" fill="none" stroke-opacity="0.7" stroke-linecap="round"/>
    <path d="M-50,-190 Q-75,-130 -60,-80" stroke="#c9a96e" stroke-width="1.5" fill="none" stroke-opacity="0.5" stroke-linecap="round"/>
    <path d="M-40,-195 Q-70,-140 -55,-90" stroke="#c9a96e" stroke-width="1" fill="none" stroke-opacity="0.4" stroke-linecap="round"/>
    <path d="M60,-180 Q80,-120 70,-60" stroke="#c9a96e" stroke-width="2" fill="none" stroke-opacity="0.7" stroke-linecap="round"/>
    <path d="M50,-190 Q75,-130 60,-80" stroke="#c9a96e" stroke-width="1.5" fill="none" stroke-opacity="0.5" stroke-linecap="round"/>
    <path d="M40,-195 Q70,-140 55,-90" stroke="#c9a96e" stroke-width="1" fill="none" stroke-opacity="0.4" stroke-linecap="round"/>
    
    <!-- Crown/top hair -->
    <path d="M-60,-160 Q0,-220 60,-160" stroke="#c9a96e" stroke-width="3" fill="none" stroke-opacity="0.8" stroke-linecap="round"/>
    <path d="M-55,-155 Q0,-205 55,-155" stroke="#c9a96e" stroke-width="1.5" fill="none" stroke-opacity="0.4" stroke-linecap="round"/>

    <!-- Head circle -->
    <circle cx="0" cy="-120" r="55" fill="none" stroke="#c9a96e" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="0" cy="-120" r="48" fill="#1a1208" stroke="#c9a96e" stroke-width="0.5" stroke-opacity="0.2"/>
    
    <!-- Face features (abstract) -->
    <ellipse cx="-15" cy="-125" rx="6" ry="4" fill="#c9a96e" fill-opacity="0.7"/>
    <ellipse cx="15" cy="-125" rx="6" ry="4" fill="#c9a96e" fill-opacity="0.7"/>
    <path d="M-12,-108 Q0,-102 12,-108" stroke="#c9a96e" stroke-width="1.5" fill="none" stroke-opacity="0.6"/>
    
    <!-- Neck -->
    <rect x="-12" y="-65" width="24" height="30" rx="8" fill="none" stroke="#c9a96e" stroke-width="1" stroke-opacity="0.4"/>
    
    <!-- Shoulders -->
    <path d="M-80,-35 Q-40,-10 0,0 Q40,-10 80,-35" stroke="#c9a96e" stroke-width="2" fill="none" stroke-opacity="0.6"/>
    
    <!-- Body/torso -->
    <path d="M-60,-20 L-70,120 Q0,140 70,120 L60,-20" stroke="#c9a96e" stroke-width="1.5" fill="none" stroke-opacity="0.4"/>
    
    <!-- Waist detail -->
    <path d="M-50,50 Q0,60 50,50" stroke="#c9a96e" stroke-width="1" fill="none" stroke-opacity="0.3" stroke-dasharray="3 4"/>
    
    <!-- Star decoration -->
    <circle cx="0" cy="-200" r="5" fill="#c9a96e" opacity="0.9"/>
    <line x1="0" y1="-210" x2="0" y2="-220" stroke="#c9a96e" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="-10" y1="-200" x2="-18" y2="-200" stroke="#c9a96e" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="10" y1="-200" x2="18" y2="-200" stroke="#c9a96e" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="-7" y1="-207" x2="-13" y2="-213" stroke="#c9a96e" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="7" y1="-207" x2="13" y2="-213" stroke="#c9a96e" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>
  
  <!-- Gold horizontal dividers -->
  <line x1="50" y1="540" x2="450" y2="540" stroke="url(#goldLine)" stroke-width="1"/>
  <line x1="50" y1="60" x2="450" y2="60" stroke="url(#goldLine)" stroke-width="1"/>
  
  <!-- Corner ornaments -->
  <g stroke="#c9a96e" stroke-width="1.5" fill="none" stroke-opacity="0.6">
    <path d="M30,30 L30,50 M30,30 L50,30"/>
    <path d="M470,30 L470,50 M470,30 L450,30"/>
    <path d="M30,570 L30,550 M30,570 L50,570"/>
    <path d="M470,570 L470,550 M470,570 L450,570"/>
  </g>
  
  <!-- Floating gold dots -->
  <circle cx="80" cy="150" r="2" fill="#c9a96e" opacity="0.5"/>
  <circle cx="420" cy="150" r="2" fill="#c9a96e" opacity="0.5"/>
  <circle cx="80" cy="450" r="2" fill="#c9a96e" opacity="0.5"/>
  <circle cx="420" cy="450" r="2" fill="#c9a96e" opacity="0.5"/>
  <circle cx="120" cy="90" r="1.5" fill="#c9a96e" opacity="0.4"/>
  <circle cx="380" cy="90" r="1.5" fill="#c9a96e" opacity="0.4"/>
</svg>
