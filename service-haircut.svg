<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="200" rx="12" fill="url(#cardBg)"/>
  <rect width="300" height="200" rx="12" fill="url(#glow1)"/>
  <rect width="300" height="200" rx="12" fill="none" stroke="#c9a96e" stroke-width="0.8" stroke-opacity="0.4"/>
  
  <!-- Stylized hair/comb shape -->
  <g transform="translate(150, 90)" stroke="#c9a96e" fill="none">
    <path d="M-50,30 Q-50,-50 0,-60 Q50,-50 50,30" stroke-width="3" stroke-linecap="round"/>
    <!-- Comb teeth -->
    <line x1="-40" y1="30" x2="-40" y2="55" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-27" y1="30" x2="-27" y2="60" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-13" y1="30" x2="-13" y2="63" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="30" x2="0" y2="64" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="13" y1="30" x2="13" y2="63" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="27" y1="30" x2="27" y2="60" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="40" y1="30" x2="40" y2="55" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Sparkle -->
    <circle cx="35" cy="-40" r="3" fill="#c9a96e" stroke="none" opacity="0.8"/>
    <line x1="35" y1="-50" x2="35" y2="-55" stroke-width="1.5"/>
    <line x1="25" y1="-40" x2="20" y2="-40" stroke-width="1.5"/>
    <line x1="45" y1="-40" x2="50" y2="-40" stroke-width="1.5"/>
  </g>
</svg>
